networks:
  icoc_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:
  # ==================== DATABASE ====================
  db:
    image: postgres:16-alpine
    container_name: icoc-db
    hostname: db
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       icoc
      POSTGRES_USER:     icoc
      POSTGRES_PASSWORD: icoc2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icoc -d icoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== VOC/AI API ====================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: icoc-api
    hostname: icoc-api
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.30
    ports:
      - "8000:8000"
    volumes:
      - ./voc:/app/voc
      - ./ai:/app/ai
      - ./noc:/app/noc                    # ← ADD THIS (your NOC API)
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./event_store.py:/app/event_store.py
      - ./event_routes.py:/app/event_routes.py
      - model_data:/app/ai/models/saved
      - shared_tmp:/tmp/shared
    env_file: .env
    environment:
      - DEMO_MODE=true
      - LAB_NETWORK=192.168.100.0/24
      - POSTGRES_URL=postgresql://icoc:icoc2026@db:5432/icoc
      - ATTACKER_SERVER_URL=http://192.168.100.200:5000
      - ZABBIX_API_URL=http://192.168.100.21:8080/api_jsonrpc.php
      - ZABBIX_USER=Admin
      - ZABBIX_PASS=zabbix
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: icoc-frontend
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.40
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

# ==================== NOC - ZABBIX ====================
  
  noc-postgres:
    image: postgres:15-alpine
    container_name: noc-postgres
    hostname: noc-postgres
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.11
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix123
    volumes:
      - noc_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  noc-zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
    container_name: noc-zabbix-server
    hostname: noc-zabbix-server
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.20
    ports:
      - "10051:10051"
    environment:
      DB_SERVER_HOST: noc-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix123
    depends_on:
      noc-postgres:
        condition: service_healthy
    restart: unless-stopped

  noc-zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
    container_name: noc-zabbix-web
    hostname: noc-zabbix-web
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.21
    ports:
      - "8080:8080"
    environment:
      ZBX_SERVER_HOST: noc-zabbix-server
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: noc-postgres
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix123
      PHP_TZ: UTC
    depends_on:
      - noc-postgres
      - noc-zabbix-server
    restart: unless-stopped

  noc-zabbix-agent:
    image: zabbix/zabbix-agent:alpine-6.4-latest
    container_name: noc-zabbix-agent
    hostname: noc-zabbix-agent
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.22
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: noc-zabbix-server
    restart: unless-stopped

  # ==================== MONITORED ENDPOINTS ====================
  
  victim:
    build:
      context: .
      dockerfile: docker/Dockerfile.victim
    container_name: icoc-victim
    hostname: victim
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.102
    ports:
      - "2222:22"
      - "8181:8080"
    volumes:
      - ./victim/agent:/agent
      - shared_tmp:/tmp/shared
    environment:
      - ICOC_API_URL=http://192.168.100.30:8000
      - VICTIM_IP=192.168.100.102
      - ZBX_SERVER_HOST=192.168.100.20 
    depends_on:
      - api
      - noc-zabbix-server        
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  # ==================== ATTACKER ====================
  
  attacker:
    build:
      context: .
      dockerfile: docker/Dockerfile.attacker
    container_name: icoc-attacker
    hostname: attacker
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.200
    ports:
      - "5000:5000"
    volumes:
      - ./attacker:/attacker
      - shared_tmp:/tmp/shared
    environment:
      - VICTIM_IP=192.168.100.102
      - VICTIM_SSH_PORT=22
      - VICTIM_HTTP_PORT=8080
      - ATTACKER_IP=192.168.100.200
      - ICOC_API_URL=http://192.168.100.30:8000
    depends_on:
      - victim
      - api
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  postgres_data:
  noc_postgres_data:    # ← ADD THIS
  model_data:
  shared_tmp: