networks:
  icoc_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24

services:

  db:
    image: postgres:16-alpine
    container_name: icoc-db
    hostname: db
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       icoc
      POSTGRES_USER:     icoc
      POSTGRES_PASSWORD: icoc2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icoc -d icoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: icoc-api
    hostname: icoc-api
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.30
    ports:
      - "8000:8000"
    volumes:
      - ./voc:/app/voc
      - ./ai:/app/ai
      - ./main.py:/app/main.py
      - ./database.py:/app/database.py
      - ./event_store.py:/app/event_store.py
      - ./event_routes.py:/app/event_routes.py
      - model_data:/app/ai/models/saved
      - shared_tmp:/tmp/shared
    env_file: .env
    environment:
      - DEMO_MODE=true
      - LAB_NETWORK=192.168.100.0/24
      - POSTGRES_URL=postgresql://icoc:icoc2026@db:5432/icoc
      - ATTACKER_SERVER_URL=http://192.168.100.200:5000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: icoc-frontend
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.40
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  victim:
    build:
      context: .
      dockerfile: docker/Dockerfile.victim
    container_name: icoc-victim
    hostname: victim
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.102
    ports:
      - "2222:22"
      - "8181:8080"
    volumes:
      - ./victim/agent:/agent
      - shared_tmp:/tmp/shared
    environment:
      - ICOC_API_URL=http://192.168.100.30:8000
      - VICTIM_IP=192.168.100.102
    depends_on:
      - api
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  attacker:
    build:
      context: .
      dockerfile: docker/Dockerfile.attacker
    container_name: icoc-attacker
    hostname: attacker
    networks:
      icoc_lab:
        ipv4_address: 192.168.100.200
    ports:
      - "5000:5000"
    volumes:
      - ./attacker:/attacker
      - shared_tmp:/tmp/shared
    environment:
      - VICTIM_IP=192.168.100.102
      - VICTIM_SSH_PORT=22
      - VICTIM_HTTP_PORT=8080
      - ATTACKER_IP=192.168.100.200
      - ICOC_API_URL=http://192.168.100.30:8000
    depends_on:
      - victim
      - api
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  postgres_data:
  model_data:
  shared_tmp: